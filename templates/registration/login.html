{% extends "queue/base.html" %}
{% load static %}
{% block content %}

<style>
/* General Body Styling */
body {
  font-family: 'Inter', system-ui, sans-serif;
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  background: url("{% static 'queue/bg.jpg' %}") no-repeat center center fixed;
  background-size: cover;
  background-attachment: fixed;
}

/* Full-screen Wrapper for Centering */
.login-wrapper {
  display: flex;
  justify-content: center;      /* Horizontal centering */
  align-items: center;          /* Vertical centering */
  min-height: 100vh;            /* Full viewport height */
  width: 100%;
  padding: 10px;
}

/* Welcome Text */
.welcome-text {
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 32px;
  font-weight: bold;
  color: white;
  text-align: center;
  text-shadow: 2px 2px 6px rgba(0,0,0,0.3);
  margin-bottom: -95px; /* works now */
}

/* Login Container */
.login-container {
  width: 780px;
  max-width: 100%;
}

/* Login Card */
.login-card {
  display: flex;
  border-radius: 40px;
  overflow: hidden;
  box-shadow: 0 4px 25px rgba(0, 0, 0, 0.2);
  background: white;
  min-height: 400px;
}

/* Left Panel - White */
.login-form-1 {
  background: #fff;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 40px 20px;
  text-align: center;
}

.login-form-1 img {
  max-width: 100%;
  height: auto;
  margin-bottom: 20px;
}

.login-form-1 .icons img {
  max-width: 90%;
  margin-top: 20px;
}

/* Right Panel - Blue Login Form */
.login-form-2 {
  background: #325aa8;
  color: white;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 40px 30px;
  border-top-right-radius: 20px;
  border-bottom-right-radius: 20px;
}

.login-form-2 form {
  width: 100%;
  max-width: 350px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.login-form-2 .form-control {
  border: none;
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 16px;
  background: #f1f1f1;
  width: 100%;
  box-sizing: border-box;
}

.login-form-2 .form-control:focus {
  background: #fff;
  outline: none;
  box-shadow: 0 0 0 3px #ffbf00;
}

.login-form-2 .btn-login,
.login-form-2 input[type="submit"] {
  background: #ffbf00;
  border: none;
  border-radius: 8px;
  color: #000;
  font-weight: 400;
  font-size: 16px;
  padding: 10px 0;
  cursor: pointer;
  transition: all 0.3s ease;
  width: 50%;
  display: block;
  margin: 0 auto;
}

.login-form-2 .btn-login:hover,
.login-form-2 input[type="submit"]:hover {
  background: #e0a800;
}

.login-form-2 .ForgetPwd {
  display: inline-block;
  text-align: center;
  color: #fff;
  font-size: 14px;
  text-decoration: underline;
  margin-top: 8px;
  transition: color 0.3s ease;
}

.login-form-2 .ForgetPwd:hover {
  color: #ffdf7e;
}

/* Responsive: Tablet */
@media (max-width: 768px) {
  .welcome-text {
    font-size: 28px;
    top: 50px;
  }

  .login-card {
    flex-direction: column;
    min-height: auto;
    border-radius: 20px;
  }

  .login-form-1, .login-form-2 {
    width: 100%;
    padding: 30px 20px;
  }

  .login-form-2 {
    border-top-right-radius: 0;
    border-bottom-left-radius: 20px;
  }

  .login-form-2 form {
    max-width: 100%;
  }
}

/* Responsive: Mobile */
@media (max-width: 480px) {
  .welcome-text {
    font-size: 24px;
    top: 40px;
  }

  .login-form-1 {
    padding: 20px 15px;
  }

  .login-form-2 {
    padding: 30px 15px;
  }
}
</style>
<br><br>
<div class="welcome-text">Welcome !</div>

<div class="login-wrapper">
  <div class="login-container">
    <div class="login-card">
      <!-- Left White Panel -->
      <div class="login-form-1">
        <img src="{% static 'queue/logo.png' %}" alt="Logo" style="max-height: 150px; margin-bottom: 20px;" />
        <div class="icons">
          <img src="{% static 'queue/icons.png' %}" alt="Icons" style="max-height: 200px;" />
        </div>
      </div>

      <!-- Right Blue Panel -->
      <div class="login-form-2">
        
        <form method="post">
          {% csrf_token %}
          <div class="form-group mb-3">
            <input type="text" class="form-control" placeholder="User Name *" name="username" required />
          </div>
          <div class="form-group mb-3">
            <input type="password" class="form-control" placeholder="Password *" name="password" required />
          </div>
          <div class="form-group mb-2">
            <input type="submit" class="btn btn-login" value="Login" />
          </div>
          <div class="form-group text-end">
            <a href="{% url 'forgot_password' %}" class="ForgetPwd">Forgot Password?</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
